<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FERRATECH PUZZLES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        h2 { margin-bottom: 5px; }
        #info-container {
            display: flex;
            justify-content: space-between;
            width: 300px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
        }
        #puzzle-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 0px;
            background: #444;
            padding: 2px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }
        .tile {
            width: 100px;
            height: 100px;
            cursor: grab;
            background-size: 300px 300px;
            background-repeat: no-repeat;
            box-sizing: border-box;
            transition: opacity 1s ease-in-out;
        }
        .tile:active {
            cursor: grabbing;
        }
        .empty {
            background: #222;
            cursor: default;
        }
        .temp-border {
            border: 1px solid #28a745 !important;
        }
        .reveal-tile {
            opacity: 0;
            animation: fadeInPiece 1s forwards ease-in-out;
        }
        @keyframes fadeInPiece {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .botoes-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        button.proximo { background-color: #28a745; }
        button.proximo:hover { background-color: #218838; }

        #proximo-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }
        #proximo-container span {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #28a745;
            font-weight: bold;
        }

        /* Sistema de Alerta Nativo Simulado */
        #custom-alert-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #custom-alert-box {
            background: #2a2a2a;
            color: #fff;
            width: 280px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            text-align: center;
            border: 1px solid #444;
        }
        #custom-alert-header {
            background: #333;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #444;
        }
        #custom-alert-message {
            padding: 20px;
            font-size: 14px;
            color: #ddd;
        }
        #custom-alert-footer {
            padding: 10px 20px 20px;
        }
        #custom-alert-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
        }
        #custom-alert-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>FERRATECH PUZZLES</h2>
    <div id="info-container">
        <span id="contador-imagem">Imagem 1 de 20</span>
        <span id="cronometro">⏱️ Tempo: 0s</span>
    </div>
    
    <div id="puzzle-container"></div>
    
    <div class="botoes-container">
        <button onclick="embaralhar()">Embaralhar</button>
        <button class="proximo" id="btn-proximo" onclick="proximaImagem()" style="display: none;">Próxima Imagem ➔</button>
    </div>

    <div id="proximo-container">
        <span id="mensagem-vitoria"></span>
    </div>

    <!-- Sistema de Alerta Nativo Simulado -->
    <div id="custom-alert-overlay">
        <div id="custom-alert-box">
            <div id="custom-alert-header">FERRATECH PUZZLES</div>
            <div id="custom-alert-message">Tempo esgotado! O desafio foi reembaralhado.</div>
            <div id="custom-alert-footer">
                <button id="custom-alert-btn" onclick="fecharAlertaPersonalizado()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('puzzle-container');
        const contadorTexto = document.getElementById('contador-imagem');
        const cronometroTexto = document.getElementById('cronometro');
        const btnProximo = document.getElementById('btn-proximo');
        const mensagemVitoria = document.getElementById('mensagem-vitoria');
        
        // Referências do Alerta Personalizado
        const alertaOverlay = document.getElementById('custom-alert-overlay');
        const alertaBtn = document.getElementById('custom-alert-btn');

        const size = 3;
        let board = [];

        const totalImagens = 20;
        let imagemAtualIndex = 1;

        let segundos = 0;
        let timer = null;
        let jogoAtivo = false;
        let vitoriaConcluida = false;
        let mostrarBordasTemp = false;

        function tocarSomVitoria() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const notas = [523.25, 659.25, 783.99, 1046.50]; 
                
                notas.forEach((frequencia, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.value = frequencia;
                    
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + index * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.12 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime + index * 0.12);
                    osc.stop(ctx.currentTime + index * 0.12 + 0.3);
                });
            } catch (e) {
                console.log("Áudio não suportado.");
            }
        }

        // --- SISTEMA DE ALERTA NATIVO SIMULADO ---
        function exibirAlertaPersonalizado() {
            // Toca o som de alarme (se configurado) antes de mostrar
            tocarSomVitoria(); // Usando som padrão para teste
            alertaOverlay.style.display = 'flex';
            alertaBtn.focus(); // Foca o botão OK para aceitar ENTER
            jogoAtivo = false; // Pausa o jogo
        }

        function fecharAlertaPersonalizado() {
            alertaOverlay.style.display = 'none';
            jogoAtivo = true; // Retoma o jogo
            // Chamar embaralhar() é responsabilidade de quem chamou o alerta,
            // mas nós configuramos para reembaralhar NO FECHAMENTO, 
            // como um fluxo de erro nativo.
            if (vitoriaConcluida) return; // Se venceu, não reembaralha
            embaralhar(); 
        }
        // --- --- --- --- ---

        function carregarImagemAtual() {
            return `imagem${imagemAtualIndex}.jpg`;
        }

        function iniciarCronometro() {
            pararCronometro();
            segundos = 0;
            cronometroTexto.innerText = `⏱️ Tempo: 0s`;
            jogoAtivo = true;
            timer = setInterval(() => {
                if (jogoAtivo) {
                    segundos++;
                    cronometroTexto.innerText = `⏱️ Tempo: ${segundos}s`;
                    
                    // Exemplo de tempo esgotado: reembaralhar aos 60s
                    // if (segundos >= 60 && !vitoriaConcluida) {
                    //    pararCronometro();
                    //    exibirAlertaPersonalizado(); // Exibe o alerta limpo
                    // }
                }
            }, 1000);
        }

        function pararCronometro() {
            jogoAtivo = false;
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function criarTabuleiro() {
            board = [...Array(size * size).keys()];
            embaralhar();
        }

        function renderizar() {
            container.innerHTML = '';
            const imagemSrc = carregarImagemAtual();

            board.forEach((val, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.style.backgroundImage = `url('${imagemSrc}')`;
                
                if (val === size * size - 1) {
                    if (vitoriaConcluida) {
                         const x = (val % size) * 100;
                         const y = Math.floor(val / size) * 100;
                         tile.style.backgroundPosition = `-${x}px -${y}px`;
                         tile.classList.add('reveal-tile');
                         if (mostrarBordasTemp) {
                             tile.classList.add('temp-border');
                         }
                    } else {
                        tile.classList.add('empty');
                        tile.style.backgroundImage = 'none';
                        tile.setAttribute('data-index', index);
                        
                        tile.addEventListener('dragover', (e) => e.preventDefault());
                        tile.addEventListener('drop', (e) => {
                            e.preventDefault();
                            const origemIndex = parseInt(e.dataTransfer.getData('text/plain'));
                            moverPeca(origemIndex);
                        });
                    }
                } else {
                    const x = (val % size) * 100;
                    const y = Math.floor(val / size) * 100;
                    tile.style.backgroundPosition = `-${x}px -${y}px`;
                    
                    if (!vitoriaConcluida
