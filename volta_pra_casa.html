<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desfecho Estelar - ASH & Ferratech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .phone-screen-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            border: 3px solid #1a233a;
        }

        #portal-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #flash-transicao {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 50;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            opacity: 0;
            transform: scale(1);
            transition: opacity 1.5s ease-in-out, transform 6s ease-out;
            z-index: 5;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1.05);
        }

        .hud-label {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            opacity: 0;
            transition: opacity 1s ease-in-out 0.3s;
            z-index: 15;
            text-align: center;
            display: none;
        }

        .slide.active ~ .hud-label.active {
            opacity: 1;
        }

        .interview-box {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            background: rgba(5, 10, 25, 0.75);
            border: 2px solid #3399ff;
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(51, 153, 255, 0.5);
            opacity: 0;
            transition: opacity 1s ease-in-out 0.3s;
            z-index: 15;
            display: none;
        }

        .slide.active ~ .interview-box.active {
            opacity: 1;
        }

        .speaker {
            color: #00ffcc;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .dialogue {
            font-size: 14px;
            line-height: 1.3;
        }

        #btn-reiniciar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            z-index: 25;
            display: none;
            font-family: 'Courier New', Courier, monospace;
        }
        #btn-reiniciar:hover {
            background: #3399ff;
            color: #fff;
        }
    </style>
</head>
<body>

    <audio id="trilha-sonora" loop>
        <source src="fundo_cinematica.mp3" type="audio/mpeg">
    </audio>

    <div class="phone-screen-container">
        <div id="flash-transicao"></div>
        <button id="btn-reiniciar" onclick="iniciarNovoJogo()">🔄 INICIAR NOVO JOGO</button>

        <!-- FASE 1: O Portal Robusto com Raios em Canvas -->
        <div id="portal-container">
            <canvas id="portalCanvas"></canvas>
        </div>

        <!-- FASE 2: Cinemática -->
        <img src="solar.png" class="slide active" alt="Sistema Solar">
        <img src="terra.png" class="slide" alt="Planeta Terra">
        <img src="goias.png" class="slide" alt="Goiás Brasil">
        <img src="zoom_goias.png" class="slide" alt="Aproximação Goiás">
        <img src="aparecida.png" class="slide" alt="Aparecida de Goiânia">
        <img src="ash_qg.png" class="slide" alt="Sede ASH - Entrevista">

        <div class="hud-label" id="label">SISTEMA SOLAR - ROTA DE RETORNO ATIVADA</div>
        
        <div class="interview-box" id="interview">
            <div class="speaker" id="speaker-name">REPÓRTER - TV ASH NEWS</div>
            <div class="dialogue" id="dialogue-text">"Comandante Mauro, a ameaça cósmica foi neutralizada!"</div>
        </div>
    </div>

    <script>
        const musica = document.getElementById('trilha-sonora');
        musica.volume = 0.5;

        document.body.addEventListener('click', () => {
            if (musica.paused) {
                musica.play().catch(e => console.log("Áudio aguardando interação", e));
            }
        }, { once: true });

        const canvas = document.getElementById('portalCanvas');
        const ctx = canvas.getContext('2d');
        const portalContainer = document.getElementById('portal-container');
        const flash = document.getElementById('flash-transicao');

        canvas.width = 400;
        canvas.height = 800;

        let angulo = 0;
        let raioPortal = 10;
        let estadoPassagem = false;
        let timerCinematica = null;
        let contadorTempo = 0; // Controla o tempo de degustação do portal

        const imgNave = new Image();
        imgNave.src = 'nave.png';

        let estrelas = Array.from({ length: 80 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            z: Math.random() * canvas.width,
            size: Math.random() * 2
        }));

        let naveY = 750; // Começa mais abaixo para ter mais percurso
        let naveEscala = 1.0;

        // Função para desenhar raios elétricos nas bordas do portal
        function desenharRaiosBorda(centerX, centerY, raio) {
            ctx.save();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';

            for (let i = 0; i < 4; i++) {
                let anguloRaio = Math.random() * Math.PI * 2;
                let x1 = centerX + Math.cos(anguloRaio) * (raio - 5);
                let y1 = centerY + Math.sin(anguloRaio) * (raio - 5);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);

                // Cria o efeito zigue-zague do raio
                let px = x1 + (Math.random() * 30 - 15);
                let py = y1 + (Math.random() * 30 - 15);
                ctx.lineTo(px, py);
                
                let x2 = centerX + Math.cos(anguloRaio + 0.2) * (raio + 10);
                let y2 = centerY + Math.sin(anguloRaio + 0.2) * (raio + 10);
                ctx.lineTo(x2, y2);
                
                ctx.stroke();
            }
            ctx.restore();
        }

        function loopPortal() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fundo estelar em velocidade de cruzeiro
            ctx.fillStyle = '#00ffcc';
            estrelas.forEach(star => {
                star.z -= 2;
                if (star.z <= 0) star.z = canvas.width;
                let k = 250 / star.z;
                let px = star.x * k;
                let py = star.y * k;
                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    ctx.fillRect(px, py, star.size * k, star.size * k);
                }
            });

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            angulo += 0.04;
            contadorTempo++;

            if (raioPortal < 140 && !estadoPassagem) {
                raioPortal += 0.8;
            }

            // Desenha as camadas do Vórtex Plasmático (com proteção anti-negativo)
            ctx.save();
            ctx.translate(centerX, centerY);
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.rotate(angulo / (i + 1));
                let grad = ctx.createRadialGradient(0, 0, raioPortal * 0.1, 0, 0, raioPortal);
                grad.addColorStop(0, 'rgba(0, 255, 204, 0.9)');
                grad.addColorStop(0.4, 'rgba(51, 153, 255, 0.6)');
                grad.addColorStop(0.8, 'rgba(128, 0, 255, 0.3)');
                grad.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 6 + (i * 2);
                
                // BLINDAGEM: Math.max garante que o raio calculado nunca seja negativo
                let raioSeguro = Math.max(1, raioPortal + (Math.sin(angulo * 2 + i) * 12));
                
                ctx.arc(0, 0, raioSeguro, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            // Raios elétricos nas bordas
            if (raioPortal > 80 && !estadoPassagem) {
                desenharRaiosBorda(centerX, centerY, raioPortal);
            }

            if (contadorTempo > 120 && naveY > centerY && !estadoPassagem) {
                naveY -= 2.5;
                if (naveEscala > 0.15) naveEscala -= 0.002;
            } else if (contadorTempo > 120 && naveY <= centerY && !estadoPassagem) {
                estadoPassagem = true;
                iniciarCinematicaFinal();
            }

            ctx.save();
            ctx.translate(centerX, naveY);
            ctx.scale(naveEscala, naveEscala);
            ctx.drawImage(imgNave, -35, -35, 70, 70);
            ctx.restore();

            if (!estadoPassagem) {
                requestAnimationFrame(loopPortal);
            }
        }
        imgNave.onload = () => {
            requestAnimationFrame(loopPortal);
        };
        if (imgNave.complete) {
            requestAnimationFrame(loopPortal);
        }

        function iniciarCinematicaFinal() {
            flash.style.opacity = '1';
            musica.play().catch(() => {});

            setTimeout(() => {
                portalContainer.style.display = 'none';
                flash.style.opacity = '0';

                slides[0].classList.add('active');
                label.style.display = 'block';
                label.classList.add('active');

                timerCinematica = setInterval(atualizarCinematica, 6000);
            }, 800);
        }

        const slides = document.querySelectorAll('.slide');
        const label = document.getElementById('label');
        const interviewBox = document.getElementById('interview');
        const speakerName = document.getElementById('speaker-name');
        const dialogueText = document.getElementById('dialogue-text');
        const btnReiniciar = document.getElementById('btn-reiniciar');
        
        const etapas = [
            { type: "hud", text: "SISTEMA SOLAR - ROTA DE RETORNO ATIVADA" },
            { type: "hud", text: "PLANETA TERRA - ENTRANDO NA ATMOSFERA" },
            { type: "hud", text: "COORDENADAS: GOIÁS, BRASIL - DESTINO ASH QG" },
            { type: "hud", text: "TRAJETÓRIA FINAL - REDUTOR DE VELOCIDADE ATIVO" },
            { type: "hud", text: "APARECIDA DE GOIÂNIA - POUSO AUTORIZADO NO QG" },
            { type: "interview", speaker: "REPÓRTER - TV ASH", text: "\"Comandante Mauro, o setor estelar está a salvo! Qual a sensação de pousar vitorioso em Aparecida?\"" },
            { type: "interview", speaker: "COMANDANTE MAURO", text: "\"Missão cumprida! A vitória pertence a toda equipe da ASH e da Ferratech. De volta ao lar!\"" }
        ];

        let currentIndex = 0;

        function atualizarCinematica() {
            if (currentIndex >= slides.length - 1) {
                clearInterval(timerCinematica);
                btnReiniciar.style.display = "block"; 

                let fadeOut = setInterval(() => {
                    if (musica.volume > 0.02) {
                        musica.volume -= 0.02;
                    } else {
                        musica.volume = 0;
                        musica.pause();
                        clearInterval(fadeOut);
                    }
                }, 100);

                return;
            }

            slides[currentIndex].classList.remove('active');
            currentIndex++;
            slides[currentIndex].classList.add('active');

            const etapaAtual = etapas[currentIndex];
            
            if (etapaAtual.type === "hud") {
                label.style.display = "block";
                interviewBox.style.display = "none";
                label.textContent = etapaAtual.text;
                
                label.classList.remove('active');
                setTimeout(() => label.classList.add('active'), 200);
            } else {
                label.style.display = "none";
                interviewBox.style.display = "block";
                speakerName.textContent = etapaAtual.speaker;
                dialogueText.textContent = etapaAtual.text;

                interviewBox.classList.remove('active');
                setTimeout(() => interviewBox.classList.add('active'), 200);
            }
        }

        function iniciarNovoJogo() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
